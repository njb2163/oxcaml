<!DOCTYPE html>
<html ng-app="myApp">

<head>
    <meta charset="utf-8">
    <title>TicTacToe</title>
    <meta name="description" content="TicTacToe game">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="hw5_static_state.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="game">
        <! -- Opponent's hand -->
            <div class="hand opponent">
                <img class="card" src="resources/CLUB-1.svg" alt="Ace of CLUB">
                <img class="card" src="resources/DIAMOND-2.svg" alt="Ten of DIAMOND">
                
            </div>

            <!-- Trick -->
            <div class="trick">
                <img class="card" src="resources/HEART-3.svg" alt="Three of HEART">
            </div>

            <!-- Player's hand -->
            <div class="hand player">
                <div class="turn-indicator">
                    <h2>Player's Turn</h2>
                </div>
                <img class="card" src="resources/SPADE-4.svg" alt="Four of SPADE">
                <img class="card" src="resources/CLUB-5.svg" alt="Five of CLUB">
                <img class="card" src="resources/SPADE-6.svg" alt="Six of SPADE">
            </div>

    </div>
</body>

</html>
